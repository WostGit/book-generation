name: book-lab

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  experiment-matrix:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        profile: [fantasy-rag-smoke, sci-fi-no-rag]
        generation_model: [qwen-2.5-7b, llama-3.1-8b, mistral-7b, gemma-2-9b]
        chapter_count: [8, 12]
        export_target: [all-formats]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run profile
        env:
          BOOKLAB_MODEL_OVERRIDE: ${{ matrix.generation_model }}
          BOOKLAB_CHAPTER_OVERRIDE: ${{ matrix.chapter_count }}
          BOOKLAB_EXPORT_OVERRIDE: ${{ matrix.export_target }}
        run: |
          python scripts/run_experiment.py --profile ${{ matrix.profile }}

      - name: Validate types and tests
        run: |
          mypy src
          pytest

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.profile }}-${{ matrix.generation_model }}-${{ matrix.chapter_count }}
          path: artifacts/
          retention-days: 14
